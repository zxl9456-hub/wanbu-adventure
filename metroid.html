<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142f34"><title>万步奇遇 · 连廊之心</title><meta name="description" content="柯基小步在安踏上海中心的类银河恶魔城冒险。探索互联地图、解锁冲刺、打开捷径，挑战联动守卫。"><link rel="icon" href="./assets/sports-energy-paw.png"><link rel="stylesheet" href="./metroid.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body><main>
<canvas id="world" tabindex="0" aria-label="连廊之心游戏。A D 移动，空格跳跃，J 攻击，Shift 冲刺，F 互动，K 远程脉冲，Q 修复，I 背包，M 地图，E 记录和释放足迹回声。"></canvas>
<header class="hud"><div class="identity"><div class="brand"><img class="paw" src="./assets/sports-energy-paw.png" alt=""><b>万步奇遇</b><img class="anta" src="./assets/anta-logo-transparent.png" alt="ANTA 安踏"></div><div id="health" class="health" aria-label="体力 5 / 5"></div><div class="energy-hud"><span>循环能量</span><progress id="energy" max="100" value="60" aria-label="循环能量"></progress><output id="energy-value">60</output></div></div><div class="location"><h1 id="room-name">大堂</h1><p id="room-subtitle">万步联动 · 10K Connectivity</p></div><nav><button id="kit-button" aria-label="打开装备背包"><svg viewBox="0 0 24 24"><path d="M8 5V3h8v2M5 5h14v16H5zM5 11h14M9 15h6"/></svg><span>背包 <kbd>I</kbd></span></button><button id="map-button" aria-label="打开探索地图"><svg viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/></svg><span>地图 <kbd>M</kbd></span></button><button id="sound" aria-label="声音设置" aria-expanded="false">♪</button><button id="menu" aria-label="暂停游戏"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></nav></header>
<section id="intro" class="intro"><div class="intro-copy"><h2>连廊之心</h2><p class="lead">每一次突破，<br>都让世界多一条路。</p><p>进入科技密室，找到 A N T A，唤醒回声伙伴。<br class="wide">带着新能力回到旧地方，让连廊、花园与大堂相连。</p><button id="start" class="primary" disabled>正在准备旅程…</button><small id="loading" role="status">正在载入建筑与小步</small><a href="./portal.html">足迹穿梭实验室 ↗</a></div></section>
<div id="play-hud" hidden><div class="objective-wrap"><p id="objective">向左探索 · 寻找水平连廊</p><small><span id="ability-label">冲刺 · 尚未解锁</span><span id="sample-count">足迹 0 / 14</span></small></div><button id="interact" class="interact" hidden><kbd>F</kbd><span>休息并存档</span></button><div id="boss-hud" hidden><div><span>联动守卫</span><span id="boss-state">读取动作</span></div><progress id="boss-health" value="12" max="12"></progress></div><div id="controls" class="controls"><div class="move-buttons"><button data-hold="left" aria-label="向左移动"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><button data-hold="right" aria-label="向右移动"><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></svg></button><span>A D 移动</span></div><div class="action-buttons"><button id="jump" data-hold="jump">跳跃 <kbd>空格</kbd></button><button id="attack" data-hold="attack">脉冲爪 <kbd>J</kbd></button><button id="dash">冲刺 <kbd>Shift</kbd></button></div></div><div class="secondary-controls"><button id="echo-button"><span id="echo-action">足迹回声</span> <kbd>E</kbd></button><button id="pulse">远程脉冲 <kbd>K</kbd></button><button id="heal">修复 +2 <kbd>Q</kbd></button></div></div>
<section id="echo-hud" class="echo-hud" hidden aria-label="回声与双点机关状态"><div id="relay-status"><b id="relay-title">连廊双点同步</b><div class="relay-pads"><span data-relay-pad="0">01 待同步</span><span data-relay-pad="1">02 待同步</span></div><progress id="relay-progress" max="1" value="0" aria-label="双点同步进度"></progress></div><p id="echo-status"></p><progress id="echo-progress" max="1" value="0" aria-label="足迹回声持续时间"></progress></section><div id="toast" role="status" aria-live="polite"></div><div id="room-flash" aria-hidden="true"></div><div id="damage-flash" aria-hidden="true"></div>
<dialog id="map-dialog" aria-labelledby="map-title"><div class="modal-heading"><div><h2 id="map-title">中心探索图</h2><p id="map-progress"></p></div><button id="map-close" class="close" aria-label="关闭地图">×</button></div><div id="map-content"></div><div class="map-legend"><span><i class="here"></i>当前区域</span><span><i></i>已探索</span><span><i class="unknown"></i>待探索</span><span>虚线 · 尚未开启的路线</span></div><div id="map-travel"></div><div id="map-journey" class="journey-card"></div><p id="map-fact" class="fact"></p><button id="map-resume" class="primary">继续探索</button></dialog>
<dialog id="dialog" aria-labelledby="dialog-title"><button id="close-dialog" class="close" aria-label="关闭菜单">×</button><div id="dialog-body"></div></dialog>
<section id="sound-panel" class="sound-panel hidden" role="dialog" aria-labelledby="sound-title"><div class="sound-heading"><h2 id="sound-title">旅程的声音</h2><button id="sound-close" aria-label="关闭声音设置">×</button></div><p class="track-title">逐光加速 <small>原创配乐 · 140 BPM</small></p><label for="music-volume">背景音乐 <output id="music-value">65%</output></label><input id="music-volume" type="range" min="0" max="100" value="65" aria-label="背景音乐音量"><label for="sfx-volume">游戏音效 <output id="sfx-value">70%</output></label><input id="sfx-volume" type="range" min="0" max="100" value="70" aria-label="游戏音效音量"><div class="sound-footer"><span id="audio-status" role="status"></span><button id="mute-audio">静音</button></div><button id="audio-retry" class="hidden">重新载入音乐</button></section>
<section id="error" hidden role="alert"><h2>旅程暂时未能载入</h2><p id="error-message"></p><button class="primary" onclick="location.reload()">重新载入</button><a href="./portal.html">返回足迹穿梭</a></section>
</main><script type="module" src="./js/metroid/game.js"></script><script type="module" src="./js/campus-return.js"></script></body></html>
