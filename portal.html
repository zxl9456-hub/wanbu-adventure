<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10333b"><title>万步奇遇 · 足迹穿梭</title><meta name="description" content="和柯基小步进入数字屏幕，拼出路线、校准投影、留下回声，让安踏上海中心的连廊相连。"><link rel="icon" href="./assets/sports-energy-paw.png"><link rel="stylesheet" href="./portal.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script><link rel="stylesheet" href="./adventure.css"><script>if(new URLSearchParams(location.search).get("from")==="campus")document.documentElement.classList.add("adventure-mode");</script><link rel="stylesheet" href="./pixel.css"></head><body data-pixel-scene="portal"><main>
<canvas id="world" tabindex="0" aria-label="足迹穿梭。A D 移动，空格跳跃，F 互动，E 留下回声。"></canvas><div class="vignette"></div>
<header class="topbar"><a class="brand" href="./lab.html"><img src="./assets/sports-energy-paw.png" class="paw" alt=""><span><b>万步奇遇</b><small>足迹穿梭</small></span><img src="./assets/anta-logo-transparent.png" class="anta" alt="ANTA 安踏"></a><ol class="progress" aria-label="关卡进度"><li id="progress-route"><span>连路</span><i></i></li><li id="progress-lamp"><span>投影</span><i></i></li><li id="progress-echo"><span>回声</span><i></i></li></ol><div class="tools"><button id="sound" aria-label="声音设置" aria-expanded="false">♪</button><button id="menu" aria-label="暂停游戏">Ⅱ</button></div></header>
<section id="intro" class="intro"><div><h1>走进屏幕，<br>让足迹连成路。</h1><p>拼接路线 · 转动光影 · 与自己的回声同行</p><button id="start" class="primary" disabled>正在准备展厅…</button><a class="metroid-entry" href="./metroid.html">连廊之心 · 探索冒险 →</a><small id="loading" role="status">正在载入建筑与小步</small></div></section>
<div id="hotspots" hidden><button data-spot="screen1">进入屏幕 <span>↗</span></button><button data-spot="lamp">校准投影 <span>↗</span></button><button data-spot="screen2">回声屏幕 <span>↗</span></button><button data-spot="exit">抵达终点 <span>↗</span></button></div>
<section id="screen-view" class="screen-view" hidden aria-labelledby="screen-title"><div class="screen-heading"><button id="leave-screen" class="text-button">← 返回展厅 <kbd>Esc</kbd></button><div><h1 id="screen-title">连接足迹</h1><p id="screen-desc"></p></div><button id="hint" class="text-button">嗅闻提示 ⌁</button></div><canvas id="board" width="1008" height="420" tabindex="0" aria-label="屏幕内的足迹道路，可用 A D 移动和空格跳跃"></canvas><div id="tile-controls"><p>选择两块面板交换，也可以拖动交换。</p><div id="tiles" aria-label="路线面板"></div><button id="clear-selection" class="text-button">取消选择</button></div><p id="screen-status" role="status" aria-live="polite"></p><div class="screen-footer"><span id="collected">隐藏足迹 0 / 3</span><button id="retry" class="text-button">↺ 回到起点</button></div></section>
<section id="projector-panel" class="projector-panel" hidden aria-labelledby="projector-title"><button id="close-projector" class="close" aria-label="关闭投影控制">×</button><h2 id="projector-title">让光，成为台阶。</h2><p>转动投影，观察阶梯能否连续抵达上层。</p><div class="angles" role="group" aria-label="投影角度"><button data-angle="0">22°</button><button data-angle="1">45°</button><button data-angle="2">68°</button></div><button id="lock-lamp" class="primary">锁定投影 →</button></section>
<div id="play-hud" hidden><p id="objective" class="objective" role="status">走近屏幕，进入足迹世界。</p><div class="controls"><div class="movement"><button data-hold="left" aria-label="向左移动">←</button><button data-hold="right" aria-label="向右移动">→</button><button id="jump" aria-label="跳跃">跳跃 <kbd>空格</kbd></button><small>A D 移动</small></div><div class="actions"><button id="echo" hidden>留下回声 <kbd>E</kbd></button><button id="interact" class="primary">进入屏幕 <kbd>F</kbd> ↗</button></div></div></div>
<section id="sound-panel" class="sound-panel hidden" role="dialog" aria-labelledby="sound-title"><div class="sound-heading"><h2 id="sound-title">旅程的声音</h2><button id="sound-close" aria-label="关闭声音设置">×</button></div><p class="track-title">逐光加速 <small>原创配乐 · 140 BPM</small></p><label for="music-volume">背景音乐 <output id="music-value">65%</output></label><input id="music-volume" type="range" min="0" max="100" value="65" aria-label="背景音乐音量"><label for="sfx-volume">游戏音效 <output id="sfx-value">70%</output></label><input id="sfx-volume" type="range" min="0" max="100" value="70" aria-label="游戏音效音量"><div class="sound-footer"><span id="audio-status" role="status"></span><button id="mute-audio">静音</button></div><button id="audio-retry" class="text-button hidden">重新载入音乐 ↗</button></section>
<div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><button id="close-dialog" class="close" aria-label="关闭菜单">×</button><div id="dialog-body"></div></dialog><section id="error" hidden role="alert"><h2>展厅暂时未能载入</h2><p id="error-message"></p><button class="primary" onclick="location.reload()">重新载入</button><a href="./lab.html">返回科技密室</a></section>
</main><script type="module" src="./js/portal/game.js"></script></body></html>
